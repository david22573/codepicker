# .codepicker.yml
# Generated by codepicker init

src: .
output: codepicker_context.md
minify: true
tokens: false

# File extensions to include (add more as needed)
include:
  - .go
  - .ts
  - .js

# Directories to exclude
exclude:
  - .git
  - node_modules
  - vendor
  - codepicker_out

# AI integration settings
ai:
  # Supervisor: DeepSeek V3 (High intelligence, low cost)
  model: deepseek/deepseek-chat
  
  # Worker: DeepSeek V3 (Capable enough for implementation, cheaper than Claude)
  # NOTE: If hitting context limits on large files, switch this to 'google/gemini-1.5-flash'
  worker_model: deepseek/deepseek-chat
  
  temperature: 0.0


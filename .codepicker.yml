# .codepicker.yml
src: .
output: codepicker_context.md
ai:
    model: arcee-ai/trinity-large-preview:free
    temperature: 0.0

include:
    - .go
    - .mod

exclude:
    - .git
    - .codepicker
    - node_modules
    - vendor

mcp_servers:
    - name: github
      command: npx
      args: ["-y", "@modelcontextprotocol/server-github"]
      env:
          - "GITHUB_PERSONAL_ACCESS_TOKEN=YOUR_TOKEN_HERE"
